<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Paired AI engineering workflow in Daytona</title>
  <desc id="desc">A Daytona workspace flow where Omni Engineer and Claude Engineer inspect the same task, produce candidate patches, and merge into one verified result.</desc>
  <rect width="1200" height="675" fill="#0B1020"/>
  <rect x="72" y="72" width="1056" height="531" rx="28" fill="#111827" stroke="#2DD4BF" stroke-width="4"/>
